<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چرا اجاره گران می‌شود؟ — تهران ۱۳۹۶ تا ۱۴۰۳</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#12151a; --panel:#181c23; --panel-2:#1e232b; --ink:#e8eaed; --ink-dim:#9aa4b2;
    --line:#2a313b; --grid:#242a33; --danger:#e06c75;
    /* the handoff palette is tuned for a light background; these two are lifted for dark */
    --fx:#e63946; --house:#6aa6c9; --rent:#4fa97c;
  }
  html[data-theme="light"]{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f2f4f6; --ink:#111827; --ink-dim:#5b6674;
    --line:#e3e7eb; --grid:#eeeeee; --danger:#b3383f;
    --fx:#e63946; --house:#457b9d; --rent:#2d6a4f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",sans-serif;
       font-size:15px;line-height:1.9}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 72px}
  h1{font-size:27px;margin:0 0 8px;font-weight:700;line-height:1.5}
  .sub{color:var(--ink-dim);font-size:14px;margin-bottom:8px}
  .byline{color:var(--ink-dim);font-size:12.5px;margin-bottom:26px}
  h2{font-size:17px;margin:0 0 10px;font-weight:700;line-height:1.7}
  h3{font-size:16px;margin:26px 0 8px;font-weight:700}
  .theme-btn{position:fixed;inset-inline-end:16px;top:16px;background:var(--panel);color:var(--ink);
             border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-family:inherit;z-index:20}
  figure{margin:0 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  figcaption{color:var(--ink-dim);font-size:12.5px;margin-top:8px;line-height:1.85}
  figcaption b{color:var(--ink);font-weight:600}
  .chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-dim)}
  .legend .item{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
                border:1px solid var(--line);border-radius:9px;padding:4px 9px;background:var(--panel-2)}
  .legend .item[aria-pressed="false"]{opacity:.42;text-decoration:line-through}
  .legend .item:hover{border-color:var(--ink-dim)}
  .legend .item:focus-visible{outline:2px solid var(--house);outline-offset:1px}
  .legend .line{width:22px;height:0;border-top-width:3px;border-top-style:solid;display:inline-block}
  .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-dim)}
  .chips{display:flex;gap:6px}
  .chips button{font-family:inherit;font-size:13px;background:var(--panel-2);border:1px solid var(--line);
                color:var(--ink-dim);border-radius:999px;padding:5px 12px;cursor:pointer}
  .chips button[aria-pressed="true"]{border-color:var(--house);color:var(--ink)}
  .chart-wrap{position:relative}
  .chart-scroll{overflow:hidden}
  svg.chart{width:100%;height:auto;display:block;touch-action:none;direction:ltr}
  @media (max-width:760px){
    .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    svg.chart{min-width:820px}
  }
  svg.chart text{font-family:Vazirmatn,system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
  svg.chart text.axis-label,svg.chart text.mark-label{unicode-bidi:isolate;direction:rtl}
  .grid-line{stroke:var(--grid);stroke-width:1}
  .axis-line{stroke:var(--line);stroke-width:1}
  .zero-line{stroke:var(--ink-dim);stroke-width:1.4;opacity:.85}
  .tick{fill:var(--ink-dim);font-size:12px}
  .axis-label{fill:var(--ink-dim);font-size:11.5px}
  .line{fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dot{stroke:var(--panel);stroke-width:1.4}
  .s-fx{stroke:var(--fx)}.s-house{stroke:var(--house)}.s-rent{stroke:var(--rent)}
  .d-fx{fill:var(--fx)}.d-house{fill:var(--house)}.d-rent{fill:var(--rent)}
  .b-fx{fill:var(--fx)}.b-house{fill:var(--house)}.b-rent{fill:var(--rent)}
  .b-neg{opacity:.45}
  .hit{fill:transparent;cursor:crosshair}
  .hit:hover{fill:rgba(127,127,127,.08)}
  .mark-line{stroke:var(--ink-dim);stroke-width:1;stroke-dasharray:3 5;opacity:.5}
  .mark-dot{fill:var(--panel);stroke:var(--ink-dim);stroke-width:1}
  .mark-num{fill:var(--ink-dim);font-size:10px}
  .mark-label{fill:var(--ink-dim);font-size:11px}
  .gap-line{stroke:var(--ink-dim);stroke-width:1.2;stroke-dasharray:2 4;opacity:.7}
  .cursor-line{stroke:var(--ink-dim);stroke-width:1;stroke-dasharray:3 3}
  .tip{position:absolute;display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
       padding:9px 11px;font-size:12.5px;pointer-events:none;z-index:10;min-width:240px;
       box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .tip .t-title{font-weight:700;margin-bottom:6px}
  .tip .t-row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
  .tip .t-row .k{color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .tip .t-row .k i{width:16px;height:0;border-top-width:3px;border-top-style:solid;display:inline-block}
  .tip .t-row .v{white-space:nowrap}
  .tip .t-row .lv{color:var(--ink-dim);font-size:11.5px}
  .tip .t-q{color:var(--ink-dim);font-size:11.5px;margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
  .hint{color:var(--ink-dim);font-size:12.5px;margin-top:10px;line-height:1.85}
  .mark-note{color:var(--ink-dim);font-size:12.5px;margin-top:6px;line-height:2}
  .mark-note b{color:var(--ink);font-weight:600}
  .prose{max-width:76ch}
  .prose p{margin:0 0 14px}
  .callout{background:var(--panel-2);border:1px solid var(--line);border-inline-start:3px solid var(--house);
           border-radius:10px;padding:12px 14px;margin:18px 0;font-size:13.5px;color:var(--ink-dim);line-height:1.9}
  .callout b{color:var(--ink)}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap}
  th{color:var(--ink-dim);font-weight:600}
  tr.base td{background:var(--panel-2)}
  tr:hover td{background:var(--panel-2)}
  td.y{color:var(--ink-dim)}
  td.neg{color:var(--danger)}
  footer{color:var(--ink-dim);font-size:12.5px;line-height:2}
  footer h3{font-size:13.5px;color:var(--ink);margin:22px 0 6px}
  footer ul{margin:0;padding-inline-start:18px}
  code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  .page-links{margin-top:26px;font-size:13px;color:var(--ink-dim)}
  .page-links a{color:var(--house)}
</style>
</head>

<div class="wrap">

  </figure>

  <footer id="footer"></footer>
  <div class="page-links" id="page-links"></div>
</div>

const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";
const toFa = s => String(s).replace(/[0-9]/g, d => FA_DIGITS[+d]);
const num = (v, d = 0) => (v === null || v === undefined || !isFinite(v)) ? "—"
  : Number(v).toLocaleString("fa-IR", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = v => (v === null || !isFinite(v)) ? "—" : (v > 0 ? "+" : "−") + num(Math.abs(v), 1) + "٪";
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const quarters = DATA.quarters;
const series = DATA.series;
const byCode = Object.fromEntries(quarters.map(q => [q.code, q]));
const seriesOf = k => series.find(s => s.key === k);
const idxOf = (q, k) => { const v = q.idx[k]; return (v === undefined || v === null || !isFinite(v)) ? null : v; };

let scale = DATA.meta.chart1.log_default ? "log" : "linear";
const hidden = new Set();
const isVisible = k => !hidden.has(k);
const visibleSeries = () => series.filter(s => isVisible(s.key));

/* ---------- shared helpers ---------- */
function niceTicks(lo, hi, logScale, count) {
  const out = [];
  if (logScale) {
    for (let e = 0; e <= 5; e++) for (const m of [1, 2, 5]) {
      const v = m * Math.pow(10, e);
      if (v >= lo && v <= hi) out.push(v);
    }
    return out;
  }
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const step = ([1, 2, 2.5, 5, 10].find(s => s * mag >= raw) || 10) * mag;
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  if (!out.length) out.push(lo, hi);
  return out;
}

function placeTip(tip, svg, wrap, xPx) {
  tip.style.display = "block";
  const rect = wrap.getBoundingClientRect();
  const tw = tip.offsetWidth;
  let left = xPx + 16;
  if (left + tw > rect.width) left = Math.max(0, xPx - tw - 16);
  tip.style.left = left + "px";
  tip.style.top = "10px";
  tip.style.direction = "rtl";
}

/* ---------- chart 1: quarterly timeline ---------- */
const W1 = 1000, H1 = 480, M1 = {t: 62, r: 30, b: 58, l: 66};

function drawTimeline() {
  const svg = document.getElementById("chart1");
  const plotW = W1 - M1.l - M1.r, plotH = H1 - M1.t - M1.b;
  const log = scale === "log";
  const qs = quarters;

  // the scale always spans every series, so toggling a line never rescales the others
  const all = series.flatMap(s => qs.map(q => idxOf(q, s.key))).filter(v => v !== null && v > 0);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (log) { lo /= 1.3; hi *= 1.1; } else { lo = 0; hi *= 1.06; }

  const y = v => log
    ? M1.t + plotH * (1 - (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)))
    : M1.t + plotH * (1 - (v - lo) / (hi - lo));
  const x = i => qs.length < 2 ? M1.l + plotW / 2 : M1.l + plotW * i / (qs.length - 1);
  const parts = [];

  for (const t of niceTicks(lo, hi, log, 6)) {
    const yy = y(t);
    if (yy < M1.t - 1 || yy > M1.t + plotH + 1) continue;
    parts.push(`<line class="grid-line" x1="${M1.l}" y1="${yy.toFixed(1)}" x2="${M1.l + plotW}" y2="${yy.toFixed(1)}"/>`);
    parts.push(`<text class="tick" x="${M1.l - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${num(t, 0)}</text>`);
  }
  parts.push(`<line class="axis-line" x1="${M1.l}" y1="${M1.t + plotH}" x2="${M1.l + plotW}" y2="${M1.t + plotH}"/>`);
  const cy = M1.t + plotH / 2;
  parts.push(`<text class="axis-label" x="18" y="${(cy + 3).toFixed(1)}" text-anchor="middle" ` +
             `transform="rotate(-90 18 ${(cy + 3).toFixed(1)})">شاخص (پایهٔ ${DATA.meta.base_label_fa} = ۱۰۰)</text>`);

  // one x label per Jalali year, at its first quarter
  qs.forEach((q, i) => {
    if (q.quarter !== 1) return;
    parts.push(`<text class="tick" x="${x(i).toFixed(1)}" y="${M1.t + plotH + 22}" text-anchor="middle">${q.year_label_fa}</text>`);
  });

  // the isolated 1396 quarter: marked as a break, never joined by a line
  const firstIdx = 0, secondIdx = 1;
  if (qs.length > 1) {
    const x1 = x(firstIdx), x2 = x(secondIdx), yv = y(idxOf(qs[firstIdx], "house") || 1);
    parts.push(`<line class="gap-line" x1="${(x1 + 6).toFixed(1)}" y1="${M1.t + plotH - 6}" ` +
               `x2="${(x2 - 6).toFixed(1)}" y2="${M1.t + plotH - 6}"/>`);
    parts.push(`<text class="tick" x="${((x1 + x2) / 2).toFixed(1)}" y="${M1.t + plotH + 40}" ` +
               `text-anchor="middle">۳ فصل داده نیست</text>`);
    void yv;
  }

  for (const mark of DATA.meta.annotations) {
    const i = qs.findIndex(q => q.code === mark.quarter);
    if (i < 0) continue;
    const mx = x(i);
    parts.push(`<line class="mark-line" x1="${mx.toFixed(1)}" y1="${M1.t}" x2="${mx.toFixed(1)}" y2="${M1.t + plotH}"/>`);
    const ty = mark.side === "top" ? M1.t - 26 : M1.t + plotH + 4;
    const anchor = mx < M1.l + 70 ? "start" : (mx > M1.l + plotW - 70 ? "end" : "middle");
    parts.push(`<circle class="mark-dot" cx="${mx.toFixed(1)}" cy="${(ty - 4).toFixed(1)}" r="8"/>`);
    parts.push(`<text class="mark-num" x="${mx.toFixed(1)}" y="${(ty - 0.5).toFixed(1)}" text-anchor="middle">${toFa(mark.n)}</text>`);
    parts.push(`<text class="mark-label" x="${mx.toFixed(1)}" y="${(ty - 16).toFixed(1)}" text-anchor="${anchor}">${esc(mark.label_fa)}</text>`);
  }

  for (const s of series) {
    if (!isVisible(s.key)) continue;
    const pts = qs.map((q, i) => ({i, v: idxOf(q, s.key)})).filter(p => p.v !== null && p.v > 0);
    // the 1396 point is drawn alone; the line starts at 1397 Q1
    const runs = [];
    let run = [];
    pts.forEach((p, j) => {
      if (j > 0 && p.i - pts[j - 1].i > 1) { runs.push(run); run = []; }
      run.push(p);
    });
    if (run.length) runs.push(run);
    for (const r of runs) {
      if (r.length > 1) {
        let d = "";
        for (const p of r) d += `${d ? "L" : "M"}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)} `;
        parts.push(`<path class="line s-${s.key}" d="${d.trim()}" stroke-width="${s.width}"/>`);
      }
      for (const p of r) {
        parts.push(`<circle class="dot d-${s.key}" cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.4"/>`);
      }
    }
  }

  parts.push(`<g class="cursor"></g>`);
  qs.forEach((q, i) => {
    const half = plotW / (qs.length - 1) / 2;
    parts.push(`<rect class="hit" data-i="${i}" x="${(x(i) - half).toFixed(1)}" y="${M1.t}" ` +
               `width="${(half * 2).toFixed(1)}" height="${plotH}"/>`);
  });

  svg.innerHTML = parts.join("");
  for (const hit of svg.querySelectorAll(".hit")) {
    hit.addEventListener("mousemove", () => showTimelineCursor(+hit.dataset.i, x, y));
    hit.addEventListener("mouseleave", hideTimelineCursor);
  }
}

function showTimelineCursor(i, x, y) {
  const svg = document.getElementById("chart1");
  const q = quarters[i];
  const cursor = svg.querySelector(".cursor");
  let markup = `<line class="cursor-line" x1="${x(i).toFixed(1)}" y1="${M1.t}" ` +
               `x2="${x(i).toFixed(1)}" y2="${(M1.t + (H1 - M1.t - M1.b)).toFixed(1)}"/>`;
  for (const s of series) {
    if (!isVisible(s.key)) continue;
    const v = idxOf(q, s.key);
    if (v === null) continue;
    markup += `<circle class="d-${s.key}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" ` +
              `stroke="var(--panel)" stroke-width="2"/>`;
  }
  cursor.innerHTML = markup;

  const rows = series.map(s => {
    if (!isVisible(s.key)) return "";
    const v = idxOf(q, s.key);
    if (v === null) return "";
    const level = `${num(q.levels[s.key], s.level_digits)} ${s.level_suffix_fa}`;
    return `<div class="t-row"><span class="k"><i style="border-top-color:var(--${s.key})"></i>${s.label_fa}</span>` +
           `<span class="v">${num(v, 1)}</span></div>` +
           `<div class="t-row"><span class="k"></span><span class="lv">${level}</span></div>`;
  }).join("");
  const note = q.orphan
    ? `<div class="t-q">این فصل تنها فصل پوشش‌دادهٔ ۱۳۹۶ است؛ سه فصل بعدی داده ندارد.</div>`
    : `<div class="t-q">شاخص‌ها با پایهٔ ${DATA.meta.base_label_fa} = ۱۰۰.</div>`;
  const tip = document.getElementById("tip1");
  tip.innerHTML = `<div class="t-title">${esc(q.short_fa)}</div>${rows}${note}`;
  const svgRect = svg.getBoundingClientRect();
  const wrapRect = svg.closest(".chart-wrap").getBoundingClientRect();
  placeTip(tip, svg, svg.closest(".chart-wrap"), x(i) * (svgRect.width / W1) + (svgRect.left - wrapRect.left));
}

function hideTimelineCursor() {
  const c = document.querySelector("#chart1 .cursor");
  if (c) c.innerHTML = "";
  document.getElementById("tip1").style.display = "none";
}

/* ---------- chart 3: annual YoY grouped bars ---------- */
const W3 = 1000, H3 = 420, M3 = {t: 30, r: 26, b: 58, l: 66};

function drawAnnual() {
  const svg = document.getElementById("chart3");
  const rows = DATA.annual.filter(a => a.yoy && a.yoy.fx !== null);
  const plotW = W3 - M3.l - M3.r, plotH = H3 - M3.t - M3.b;

  const values = rows.flatMap(a => series.map(s => a.yoy[s.key])).filter(v => v !== null && isFinite(v));
  const hi = Math.max(...values, 0) * 1.08;
  const lo = Math.min(...values, 0) - 8;
  const y = v => M3.t + plotH * (1 - (v - lo) / (hi - lo));

  const groupW = plotW / rows.length;
  const barW = Math.min(26, groupW / 4.2);
  const parts = [];

  for (const t of niceTicks(lo, hi, false, 6)) {
    const yy = y(t);
    if (yy < M3.t - 1 || yy > M3.t + plotH + 1) continue;
    parts.push(`<line class="grid-line" x1="${M3.l}" y1="${yy.toFixed(1)}" x2="${M3.l + plotW}" y2="${yy.toFixed(1)}"/>`);
    parts.push(`<text class="tick" x="${M3.l - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${num(t, 0)}٪</text>`);
  }
  // the zero line is the one that matters here, so it is drawn solid
  const zy = y(0);
  parts.push(`<line class="zero-line" x1="${M3.l}" y1="${zy.toFixed(1)}" x2="${M3.l + plotW}" y2="${zy.toFixed(1)}"/>`);

  const cx = M3.t + plotH / 2;
  parts.push(`<text class="axis-label" x="18" y="${(cx + 3).toFixed(1)}" text-anchor="middle" ` +
             `transform="rotate(-90 18 ${(cx + 3).toFixed(1)})">رشد نسبت به سال قبل (٪)</text>`);

  rows.forEach((a, i) => {
    const centre = M3.l + groupW * (i + 0.5);
    parts.push(`<text class="tick" x="${centre.toFixed(1)}" y="${M3.t + plotH + 22}" text-anchor="middle">${a.label_fa}</text>`);
    const shown = series.filter(s => isVisible(s.key));
    shown.forEach((s, j) => {
      const v = a.yoy[s.key];
      if (v === null || !isFinite(v)) return;
      const offset = (j - (shown.length - 1) / 2) * (barW + 5);
      const bx = centre + offset - barW / 2;
      const top = Math.min(y(v), zy), height = Math.abs(y(v) - zy);
      parts.push(`<rect class="b-${s.key}${v < 0 ? " b-neg" : ""}" x="${bx.toFixed(1)}" y="${top.toFixed(1)}" ` +
                 `width="${barW.toFixed(1)}" height="${Math.max(height, 1).toFixed(1)}" rx="2"><title>` +
                 `${esc(a.label_fa)} · ${esc(s.label_fa)}: ${pct(v)}</title></rect>`);
      parts.push(`<text class="tick" x="${(bx + barW / 2).toFixed(1)}" ` +
                 `y="${(v >= 0 ? top - 5 : top + height + 13).toFixed(1)}" text-anchor="middle" ` +
                 `style="font-size:10.5px">${num(v, 0)}</text>`);
    });
  });

  parts.push(`<line class="axis-line" x1="${M3.l}" y1="${M3.t + plotH}" x2="${M3.l + plotW}" y2="${M3.t + plotH}"/>`);
  svg.innerHTML = parts.join("");
}

/* ---------- renderers ---------- */
function renderLegend() {
  const legend = document.getElementById("c1-legend");
  legend.innerHTML = series.map(s => {
    const on = isVisible(s.key);
    return `<span class="item" role="button" tabindex="0" data-key="${s.key}" data-legend="1" aria-pressed="${on}" ` +
           `title="${esc(s.unit_fa)}">` +
           `<span class="line" style="border-top-color:var(--${s.key})"></span>${s.label_fa}</span>`;
  }).join("");
  const legend3 = document.getElementById("c3-legend");
  legend3.innerHTML = series.map(s =>
    `<span class="item" data-key="${s.key}" data-legend="3" title="${esc(s.unit_fa)}">` +
    `<span class="line" style="border-top-color:var(--${s.key})"></span>${s.label_fa}</span>`).join("");
  for (const node of document.querySelectorAll("[data-legend]")) {
    if (node.dataset.legend !== "1") continue;
    const toggle = () => toggleSeries(node.dataset.key);
    node.addEventListener("click", toggle);
    node.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); }
    });
  }
}

function toggleSeries(key) {
  if (isVisible(key)) {
    if (visibleSeries().length === 1) return; // never leave a chart empty
    hidden.add(key);
  } else {
    hidden.delete(key);
  }
  render();
}

function renderTable() {
  const head = `<thead><tr><th>سال</th>` +
    series.map(s => `<th>${esc(s.label_fa)}</th>`).join("") + `<th>پوشش</th></tr></thead>`;
  const body = DATA.annual.map(a => {
    const cells = series.map(s => {
      const v = a.yoy[s.key];
      return `<td${v !== null && v < 0 ? ' class="neg"' : ""}>${v === null ? "—" : pct(v)}</td>`;
    }).join("");
    const coverage = a.complete ? "۴ فصل" : `${toFa(a.quarters_present)} فصل`;
    return `<tr${a.yoy.fx === null ? ' class="base"' : ""}><td class="y">${a.label_fa}</td>${cells}` +
           `<td>${coverage}</td></tr>`;
  }).join("");
  document.getElementById("table").innerHTML = head + `<tbody>${body}</tbody>`;
  document.getElementById("table-note").textContent =
    `رشد = میانگین چهار فصلِ سال ÷ میانگین چهار فصلِ سال قبل − ۱. ` +
    `۱۳۹۷ رشد ندارد چون ۱۳۹۶ فقط یک فصل پوشش دارد — همان سال پایهٔ شاخص‌ها هم هست.`;
}

function renderNarrative() {
  const slots = {"chart1-text": "text1", "chart3-text": "text3", "chart-divergence-text": "text-divergence"};
  for (const block of NARRATIVE) {
    const target = document.getElementById(slots[block.id]);
    if (!target) continue;
    target.innerHTML = `<h3>${esc(block.heading_fa)}</h3>` + block.paras_fa.map(p => `<p>${esc(p)}</p>`).join("");
  }
}

function renderFooter() {
  document.getElementById("footer").innerHTML = `
    <h3>منابع</h3>
    <ul>${DATA.sources.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h3>این ارقام چه هستند و چه نیستند</h3>
    <ul>${DATA.caveats.map(s => `<li>${esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`).join("")}</ul>
    <p>ساخته‌شده با <code>python3 scripts/build_rent_drivers.py</code> — دادهٔ درون‌صفحه از
    <code>data/rent_drivers/drivers_data.json</code> است؛ فایل را دستی ویرایش نکنید.</p>`;
  document.getElementById("page-links").innerHTML =
    `صفحه‌های مرتبط: <a href="rent-vs-fx.html">اجاره در برابر ارز — ۱۳۹۰ تا ۱۴۰۰</a> · ` +
    `<a href="housing-price.html">قیمت مسکن، ارز و تورم</a>`;
}

function render() {
  hideTimelineCursor();
  for (const btn of document.querySelectorAll("#c1-scale button"))
    btn.setAttribute("aria-pressed", String(btn.dataset.scale === scale));

  document.getElementById("title").textContent = DATA.meta.title_fa;
  document.getElementById("sub").textContent = DATA.meta.subtitle_fa;
  document.getElementById("byline").textContent =
    `${toFa(DATA.meta.quarters_count)} فصل، ${DATA.meta.stats.window.first_label_fa} تا ${DATA.meta.stats.window.last_label_fa} · ` +
    `همهٔ شاخص‌ها با پایهٔ ${DATA.meta.base_label_fa} = ۱۰۰`;

  document.getElementById("c1-heading").textContent = "سه شاخص، یک محور — روی مقیاس لگاریتمی";
  document.getElementById("hint1").textContent =
    (scale === "log"
      ? "مقیاس لگاریتمی: شیب برابر یعنی نرخ رشد برابر. روی این مقیاس هم‌زمانی جهش‌ها دیده می‌شود."
      : "مقیاس خطی: محور از صفر آغاز می‌شود و قدر مطلق را نشان می‌دهد، پس سال‌های آخر خطوط را بالا می‌برد.") +
    " روی هر سال بایستید تا سه شاخص و مقدار واقعی‌شان را ببینید.";
  document.getElementById("c1-caption").innerHTML =
    `<b>شاخص‌ها:</b> دلار، قیمت هر متر مسکن و اجارهٔ ماهانهٔ هر متر — همه با پایهٔ ${DATA.meta.base_label_fa} = ۱۰۰. ` +
    `نقطهٔ منفرد ${DATA.meta.stats.window.first_label_fa} تنها فصل پوشش‌دادهٔ ۱۳۹۶ است؛ سه فصل بعد از آن داده ندارد و ` +
    `خط از روی آن کشیده نشده است.`;
  document.getElementById("mark-note").innerHTML =
    DATA.meta.annotations.map(a => `<b>${toFa(a.n)}</b> ${esc(a.label_fa)}`).join(" &nbsp;·&nbsp; ") +
    ` <span>— این علامت‌ها زمینهٔ تفسیری‌اند، نه داده؛ از سری‌ها استخراج نشده‌اند.</span>`;

  document.getElementById("c3-heading").textContent = "رشد سالانه — چه کسی جلو زد؟";
  document.getElementById("hint3").textContent =
    "هر گروه یک سال است و سه ستون، سه سری. خط صفر پررنگ است و ستون‌های منفی کم‌رنگ‌تر دیده می‌شوند. " +
    "نمودار از ۱۳۹۸ آغاز می‌شود چون ۱۳۹۷ سال پایه است و سال قبلش پوشش کامل ندارد.";
  document.getElementById("c3-caption").innerHTML =
    `<b>رشد سالانه</b> از میانگین چهار فصلِ هر سال نسبت به میانگین چهار فصلِ سال قبل محاسبه شده — نه از یک نقطه. ` +
    `دو سری صعودی همیشه همبستگی بالایی دارند، حتی بدون هیچ رابطهٔ واقعی؛ به همین دلیل این نمودار نرخ رشد را نشان ` +
    `می‌دهد، نه سطح قیمت را.`;

  document.getElementById("method-callout").innerHTML =
    `<b>یک تصمیم روشی:</b> سند اولیه یک «نمودار تأخیر زمانی» می‌خواست تا نشان دهد مسکن با تأخیر ۱–۲ فصل دنبال دلار ` +
    `می‌رود. آن نمودار ساخته نشد و ادعای تأخیر از متن‌ها هم برداشته شد، چون داده آن را نشان نمی‌دهد: روی سطح، ` +
    `R² در تأخیرهای ۰ و ۱ و ۲ و ۳ تقریباً یکسان بود (۰٫۹۵ تا ۰٫۹۸) و روی تغییرات فصلی به ۰٫۰۲ و ۰٫۱۲ می‌افتاد. ` +
    `آنچه می‌ماند توالی و هم‌زمانی است، نه یک تأخیر اندازه‌گیری‌شده.`;

  drawTimeline();
  drawAnnual();
  renderLegend();
  renderTable();
  renderNarrative();
}

for (const btn of document.querySelectorAll("#c1-scale button"))
  btn.onclick = () => { scale = btn.dataset.scale; render(); };

document.getElementById("theme").onclick = () => {
  const html = document.documentElement;
  const next = html.dataset.theme === "dark" ? "light" : "dark";
  html.dataset.theme = next;
  try { localStorage.setItem("rd-theme", next); } catch (e) {}
};
try {
  const saved = localStorage.getItem("rd-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch (e) {}

renderFooter();
render();
</script>
</body>
</html>
